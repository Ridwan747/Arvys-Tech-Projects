<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Registration</h1>
            <p>Add students and view the students registered.</p>
        </header>

        <div class="form-container">

            <h2>Add Student</h2>

            <form id="studentForm">

                <label for="name">Student Name</label>
                <input type="text" id="name" placeholder="Enter student name">

                <label for="matric">Matric Number</label>
                <input type="text" id="matric" placeholder="Enter matric number">

                <label for="level">Level</label>
                <input type="text" id="level" placeholder="Enter level">

                <label for="department">Department</label>
                <input type="text" id="department" placeholder="Enter department">

                <button type="submit">Add Student</button>

            </form>

        </div>

        <div class="students-container">

            <div class="students-header">
                <div>
                    <h2>Registered Students</h2>
                    <p id="studentCount">0 students</p>
                </div>

                <button id="removeButton" class="remove-button">
                    Remove Last Student
                </button>
            </div>

            <div id="studentList">
                <p class="empty-message">No students have been added yet.</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
