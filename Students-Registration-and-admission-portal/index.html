<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Admission Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Students Admission Portal</h1>
            <p>Register new students and view all registered students.</p>
        </header>

        <div class="form-container">
            <h2>Register Student</h2>
            <form id="admissionForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter full name">
                    <span class="error" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email address">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter phone number">
                    <span class="error" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter age">
                    <span class="error" id="ageError"></span>
                </div>

                <div class="form-group">
                    <label for="matric">Matriculation Number</label>
                    <input type="text" id="matric" placeholder="Enter matric number">
                    <span class="error" id="matricError"></span>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="Enter department">
                    <span class="error" id="departmentError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password (min 6 characters)">
                    <span class="error" id="passwordError"></span>
                </div>

                <button type="submit">Register Student</button>
            </form>
        </div>

        <div class="students-container">
            <div class="students-header">
                <div>
                    <h2>Registered Students</h2>
                    <p id="studentCount">0 students</p>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="studentsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Age</th>
                            <th>Matric No</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody">
                    </tbody>
                </table>
                <p class="empty-message" id="emptyMessage">No students have been registered yet.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
